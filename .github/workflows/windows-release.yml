name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.5.1
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      GODEBUG: http2client=0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root dependency install failed' }
          npm ci --prefix app/provider-source --omit=dev --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Provider dependency install failed' }
      - name: Test player behavior
        run: npm test
      - name: Build portable app
        run: npm run build:windows
      - name: Publish and verify release assets
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          Copy-Item dist/HexSec-Windows.zip dist/HexSec-Windows-compact.zip
          $expected = (Get-FileHash dist/HexSec-Windows-compact.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/SHA256SUMS.txt "$expected  HexSec-Windows-compact.zip" -Encoding ascii
          git archive --format=zip --prefix=HexSec-source/ -o dist/HexSec-source.zip HEAD
          gh release upload $env:RELEASE_TAG dist/HexSec-Windows-compact.zip dist/HexSec-source.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -eq 'HexSec-Windows-compact.zip'
          if ($asset.state -ne 'uploaded' -or $asset.size -ne (Get-Item dist/HexSec-Windows-compact.zip).Length -or $asset.digest -ne "sha256:$expected") { throw 'Uploaded asset failed checksum verification' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --title "HexSec $env:RELEASE_TAG - Windows" --notes-file scripts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
